
name: NEXUS RED - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extrair ZIP do projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum ZIP encontrado na raiz do repositorio."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Encontrar projeto Android
        run: |
          SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts nao encontrado no ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: configuracao Android do app nao encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RED-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
