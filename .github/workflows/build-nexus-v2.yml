name: NEXUS RED v2 corrigido - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NEXUS-RED-v2-corrigido.zip'
      - '.github/workflows/build-nexus-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify corrected ZIP
        shell: bash
        run: |
          ZIP_FILE="NEXUS-RED-v2-corrigido.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Expected $ZIP_FILE in the repository root."
            echo "ZIP files present:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "Using corrected project archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract corrected Nexus v2
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "NEXUS-RED-v2-corrigido.zip" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle(.kts) found in the corrected ZIP."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::No Android app Gradle file found under $PROJECT_DIR/app."
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Apply Kotlin compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          source = project / "app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt"
          if not source.is_file():
              raise SystemExit(f"MainActivity.kt not found: {source}")

          code = source.read_text(encoding="utf-8")
          if "import androidx.activity.compose.rememberLauncherForActivityResult" not in code:
              code = code.replace(
                  "import androidx.activity.compose.setContent\n",
                  "import androidx.activity.compose.setContent\nimport androidx.activity.compose.rememberLauncherForActivityResult\n",
                  1
              )
          if "import android.os.BatteryManager" not in code:
              code = code.replace("import android.os.Bundle\n", "import android.os.Bundle\nimport android.os.BatteryManager\n", 1)
          code = code.replace(
              "Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)",
              "Intent(android.provider.Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)"
          )
          if "@OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)\n@Composable\nprivate fun NexusApp(" not in code:
              code = code.replace(
                  "@Composable\nprivate fun NexusApp(",
                  "@OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)\n@Composable\nprivate fun NexusApp(",
                  1
              )
          if "private fun readBatteryPercent(" not in code:
              code += """\n
          /** Returns the device battery level as a percentage, or an unavailable message. */
          private fun readBatteryPercent(context: Context): String {
              val batteryManager = context.getSystemService(Context.BATTERY_SERVICE) as? BatteryManager
              val level = batteryManager?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: -1
              return if (level in 0..100) "$level%" else "INDISPONÍVEL"
          }
          """
          source.write_text(code, encoding="utf-8")
          print("Applied compile fixes to", source)
          PY

      - name: Add fluid Nexus animations and compact operation log
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt"
          code = source.read_text(encoding="utf-8")

          # Compose page transitions and animation primitives.
          if "import androidx.compose.animation.*" not in code:
              code = code.replace("import androidx.compose.foundation.background\n",
                                  "import androidx.compose.animation.*\nimport androidx.compose.animation.core.*\nimport androidx.compose.foundation.background\n", 1)

          old = "                when (page) {"
          new = """                AnimatedContent(
                      targetState = page,
                      transitionSpec = {
                          (fadeIn(animationSpec = tween(240)) +
                              slideInHorizontally(initialOffsetX = { it / 12 }, animationSpec = tween(240))) togetherWith
                              (fadeOut(animationSpec = tween(160)) +
                                  slideOutHorizontally(targetOffsetX = { -it / 24 }, animationSpec = tween(160)))
                      },
                      label = "nexus_page_transition"
                  ) { activePage ->
                      when (activePage) {"""
          if "nexus_page_transition" not in code:
              if old not in code:
                  raise SystemExit("Could not find main page switch; refusing to patch blindly.")
              code = code.replace(old, new, 1)
              close_marker = """                }

                  Spacer(Modifier.height(8.dp))
                  Row("""
              if close_marker not in code:
                  close_marker = """                }

                Spacer(Modifier.height(8.dp))
                Row("""
              if close_marker not in code:
                  raise SystemExit("Could not find end of page switch; refusing to patch blindly.")
              code = code.replace(close_marker, close_marker.replace("                }", "                      }\n                  }", 1), 1)

          # Subtle breathing pulse on the online indicator.
          header_marker = """private fun Header(palette: NexusPalette) {
              Row("""
          header_new = """private fun Header(palette: NexusPalette) {
              val pulseTransition = rememberInfiniteTransition(label = "nexus_online_pulse")
              val pulse by pulseTransition.animateFloat(
                  initialValue = 0.58f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(1100, easing = FastOutSlowInEasing),
                      repeatMode = RepeatMode.Reverse
                  ),
                  label = "nexus_online_alpha"
              )
              Row("""
          if "nexus_online_pulse" not in code:
              if header_marker not in code:
                  raise SystemExit("Could not find Header composable.")
              code = code.replace(header_marker, header_new, 1)
              code = code.replace('Text("● ONLINE", color = palette.accent, fontSize = 9.sp, fontWeight = FontWeight.Bold)',
                                  'Text("● ONLINE", color = palette.accent.copy(alpha = pulse), fontSize = 9.sp, fontWeight = FontWeight.Bold)')

          # Make the home log compact so it doesn't dominate the dashboard.
          log_start = '                        HudPanel("LOG DE OPERAÇÕES", palette.secondary, palette.accent) {'
          log_end = """                        }
                          Spacer(Modifier.weight(1f))"""
          if log_start in code:
              start = code.index(log_start)
              end = code.find(log_end, start)
              if end == -1:
                  raise SystemExit("Could not find end of operation log panel.")
              end += len("                        }")
              compact = """                        HudPanel("LOG // ÚLTIMO EVENTO", palette.secondary, palette.accent) {
                              Text("● Interface inicializada  •  Perfil ${palette.name}", color = Muted, fontSize = 9.sp, maxLines = 1)
                          }"""
              code = code[:start] + compact + code[end:]

          source.write_text(code, encoding="utf-8")
          print("Applied page transitions, online pulse, and compact log.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RED-v2-corrigido-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
