name: NEXUS Cyber Launcher - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NEXUS-RED-v2-corrigido.zip'
      - 'app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt'
      - '.github/workflows/build-nexus-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate original project archive
        shell: bash
        run: |
          test -s NEXUS-RED-v2-corrigido.zip
          unzip -t NEXUS-RED-v2-corrigido.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract original Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q NEXUS-RED-v2-corrigido.zip -d extracted
          SETTINGS="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"; fi
          test -n "$SETTINGS" || { echo "::error::No Gradle settings file found in archive"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::No Android app module found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply redesigned Nexus interface
        shell: bash
        run: |
          TARGET="$PROJECT_DIR/app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt"
          test -s app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt
          mkdir -p "$(dirname "$TARGET")"
          cp app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt "$TARGET"
          echo "Redesigned launcher source applied:"
          wc -l "$TARGET"
          grep -q 'NEXUS // APP MATRIX' "$TARGET"
          grep -q 'CENTRAL DE ALERTAS' "$TARGET"
          grep -q 'CONFIGURAÇÕES // HUD' "$TARGET"
          grep -q 'REGISTRO DE OPERAÇÕES' "$TARGET"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::APK was not generated"; exit 1; }
          ls -lh "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/NEXUS-Cyber-Launcher-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Cyber-Launcher-APK
          path: output/NEXUS-Cyber-Launcher-debug.apk
          if-no-files-found: error
          retention-days: 14
