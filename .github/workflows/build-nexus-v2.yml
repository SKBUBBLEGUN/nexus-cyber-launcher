name: NEXUS RED v2 - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS-RED-v2.zip'
      - '.github/workflows/build-nexus-v2.yml'
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for NEXUS RED v2 ZIP
        run: |
          if [ ! -f "NEXUS-RED-v2.zip" ]; then
            echo "::error::NEXUS-RED-v2.zip was not found in the repository root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract NEXUS RED v2
        run: |
          mkdir -p extracted
          unzip -q NEXUS-RED-v2.zip -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle(.kts) found inside NEXUS-RED-v2.zip."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found under $PROJECT_DIR/app."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload NEXUS RED v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RED-v2-debug-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
