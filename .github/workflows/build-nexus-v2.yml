name: NEXUS RED v2 corrigido - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NEXUS-RED-v2-corrigido.zip'
      - '.github/workflows/build-nexus-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify corrected ZIP
        shell: bash
        run: |
          ZIP_FILE="NEXUS-RED-v2-corrigido.zip"
          test -f "$ZIP_FILE"
          unzip -t "$ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract corrected Nexus v2
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "NEXUS-RED-v2-corrigido.zip" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"; fi
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect UI source temporarily
        shell: bash
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/nexus/cyberlauncher/MainActivity.kt"
          echo "===== MAINACTIVITY SOURCE BEGIN ====="
          cat "$SRC"
          echo "===== MAINACTIVITY SOURCE END ====="

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RED-v2-corrigido-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
